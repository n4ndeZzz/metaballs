<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Relevo generacional — masa orgánica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:100%;height:100%;overflow:hidden;background:#05040a;}
  body{font-family:'Space Grotesk',sans-serif;}
  #glcanvas{position:fixed;inset:0;display:block;}

  .textLayer{
    position:fixed; left:0; right:0; bottom:9vh;
    display:flex; flex-direction:column; align-items:center;
    text-align:center; pointer-events:none; z-index:5;
    padding:0 6vw;
  }
  .kicker{
    font-size:clamp(12px,1.4vw,18px);
    letter-spacing:3px;
    text-transform:uppercase;
    color:rgba(255,255,255,0.55);
    margin-bottom:0.6em;
    font-weight:500;
    transition:opacity 0.6s ease;
  }
  .title{
    font-size:clamp(22px,3.4vw,52px);
    font-weight:700;
    line-height:1.25;
    color:#f4f0f6;
    max-width:56ch;
    transition:opacity 0.6s ease;
  }

  #help{
    position:fixed; right:22px; bottom:20px; z-index:10;
    font-size:11.5px; color:rgba(255,255,255,0.5);
    line-height:1.8; text-align:right;
    transition:opacity 0.4s ease;
  }
  #help b{color:rgba(255,255,255,0.85);}

  #progress{
    position:fixed; left:22px; bottom:20px; z-index:10;
    font-size:11.5px; color:rgba(255,255,255,0.4);
    letter-spacing:1px;
  }

  .hidden{opacity:0 !important;}

  #qrPanel{
    position:fixed; top:24px; right:26px; z-index:8;
    display:flex; gap:14px;
    opacity:0; pointer-events:none;
    transition:opacity 0.8s ease;
  }
  #qrPanel.show{ opacity:1; pointer-events:auto; }
  #qrPanel .qrItem{ text-align:center; }
  #qrPanel .qrItem img{ width:84px; height:84px; border-radius:4px; display:block; }
  #qrPanel .qrItem span{ display:block; margin-top:5px; font-size:9.5px; color:rgba(255,255,255,0.6); letter-spacing:0.5px; }
  #qrPanel .qrItem a{ text-decoration:none; color:inherit; cursor:pointer; display:block; }

  #watermark{
    position:fixed; left:26px; top:24px; z-index:8;
    width:min(190px, 16vw);
    opacity:0.82;
    pointer-events:none;
  }
</style>
</head>

<script>
// ═══════════════════════════════════════════════════════════════
// GRAMÁTICA VISUAL: masa orgánica que crece y se funde (metaballs).
//
// No hay nodos discretos conectados por líneas. Hay 5 "blobs"
// (generación experimentada, generación joven, academia, industria,
// ciudad) definidos como campos de distancia (SDF) que se combinan
// con un mínimo suave (smooth-min): cuando se acercan lo suficiente,
// no se "conectan" — se FUNDEN, cambia la topología de la forma.
// El parámetro K controla qué tan fácil es esa fusión; la posición
// y el radio de cada blob narran cercanía y crecimiento. Todo el
// movimiento importante está atado a estos parámetros, nunca a
// decoración suelta.
// ═══════════════════════════════════════════════════════════════

const VERT_SRC = `#version 300 es
in vec2 aPosition;
void main() {
  gl_Position = vec4(aPosition, 0.0, 1.0);
}`;

const FRAG_SRC = `#version 300 es
precision highp float;

uniform vec2 uResolution;
uniform float uTime;
uniform vec3 uBlobPos[5];
uniform float uBlobRadius[5];
uniform vec3 uBlobColor[5];
uniform float uBlobActive[5];
uniform float uK;
uniform float uNoiseAmp;
uniform float uGlobalIntensity;
uniform sampler2D uPhotoTex;
uniform float uPhotoReveal;

out vec4 fragColor;

float hash(vec3 p) {
  p = fract(p * 0.3183099 + 0.1);
  p *= 17.0;
  return fract(p.x * p.y * p.z * (p.x + p.y + p.z));
}

float vnoise(vec3 x) {
  vec3 i = floor(x);
  vec3 f = fract(x);
  f = f * f * (3.0 - 2.0 * f);
  return mix(
    mix(
      mix(hash(i + vec3(0.0,0.0,0.0)), hash(i + vec3(1.0,0.0,0.0)), f.x),
      mix(hash(i + vec3(0.0,1.0,0.0)), hash(i + vec3(1.0,1.0,0.0)), f.x),
      f.y),
    mix(
      mix(hash(i + vec3(0.0,0.0,1.0)), hash(i + vec3(1.0,0.0,1.0)), f.x),
      mix(hash(i + vec3(0.0,1.0,1.0)), hash(i + vec3(1.0,1.0,1.0)), f.x),
      f.y),
    f.z);
}

float sdBlob(vec3 p, int idx) {
  vec3 q = p - uBlobPos[idx];
  float r = mix(-1.5, uBlobRadius[idx], uBlobActive[idx]);
  float d = length(q) - r;
  float n = vnoise(q * 2.2 + uTime * 0.15 + float(idx) * 11.0) - 0.5;
  return d + n * uNoiseAmp;
}

float smin(float a, float b, float k) {
  float h = clamp(0.5 + 0.5 * (b - a) / k, 0.0, 1.0);
  return mix(b, a, h) - k * h * (1.0 - h);
}

float mapScene(vec3 p) {
  float d = 1.0e5;
  for (int i = 0; i < 5; i++) {
    float di = sdBlob(p, i);
    d = smin(d, di, uK);
  }
  return d;
}

vec3 blendColor(vec3 p) {
  vec3 colSum = vec3(0.0);
  float wSum = 0.0;
  for (int i = 0; i < 5; i++) {
    float di = sdBlob(p, i);
    float w = uBlobActive[i] / (0.001 + abs(di) + 0.15);
    colSum += uBlobColor[i] * w;
    wSum += w;
  }
  return colSum / max(wSum, 0.0001);
}

// coordenada local normalizada al blob (o mezcla de blobs) dominante
// en este punto: así la foto se ve del mismo tamaño relativo sin
// importar la posición absoluta ni cuánto haya crecido/fusionado
// ese blob en este momento.
vec3 localBlobCoord(vec3 p) {
  vec3 centerSum = vec3(0.0);
  float radiusSum = 0.0;
  float wSum = 0.0;
  for (int i = 0; i < 5; i++) {
    float di = sdBlob(p, i);
    float w = uBlobActive[i] / (0.001 + abs(di) + 0.15);
    centerSum += uBlobPos[i] * w;
    radiusSum += uBlobRadius[i] * w;
    wSum += w;
  }
  vec3 center = centerSum / max(wSum, 0.0001);
  float radius = radiusSum / max(wSum, 0.0001);
  return (p - center) / max(radius, 0.2);
}

vec3 calcNormal(vec3 p) {
  vec2 e = vec2(0.001, 0.0);
  return normalize(vec3(
    mapScene(p + e.xyy) - mapScene(p - e.xyy),
    mapScene(p + e.yxy) - mapScene(p - e.yxy),
    mapScene(p + e.yyx) - mapScene(p - e.yyx)
  ));
}

vec3 rayDir(vec2 uv, vec3 ro, vec3 rt, float fov) {
  vec3 f = normalize(rt - ro);
  vec3 r = normalize(cross(vec3(0.0,1.0,0.0), f));
  vec3 u = cross(f, r);
  vec3 c = ro + f * fov;
  vec3 i = c + uv.x * r + uv.y * u;
  return normalize(i - ro);
}

vec3 triplanarSample(vec3 p, vec3 n, float scale) {
  vec3 blend = abs(n);
  blend = blend / (blend.x + blend.y + blend.z + 0.0001);
  vec3 xProj = texture(uPhotoTex, p.yz * scale + 0.5).rgb;
  vec3 yProj = texture(uPhotoTex, p.xz * scale + 0.5).rgb;
  vec3 zProj = texture(uPhotoTex, p.xy * scale + 0.5).rgb;
  return xProj * blend.x + yProj * blend.y + zProj * blend.z;
}

void main() {
  vec2 uv = (gl_FragCoord.xy - 0.5 * uResolution) / uResolution.y;
  // compensación de aspecto: en pantallas angostas (celular en vertical) el
  // ancho visible se comprime porque normalizamos por altura. Si el aspecto
  // es angosto, alejamos la cámara (zoom out) para que el ancho de la escena
  // siga siendo visible, con un tope para no alejarla en exceso.
  float aspect = uResolution.x / uResolution.y;
  float zoomOut = aspect < 1.0 ? clamp(1.0 / aspect, 1.0, 1.8) : 1.0;
  uv *= zoomOut;
  vec3 ro = vec3(0.0, 0.0, 6.0);
  vec3 rd = rayDir(uv, ro, vec3(0.0), 1.8);

  float t = 0.0;
  bool hit = false;
  vec3 p = ro;
  for (int i = 0; i < 96; i++) {
    p = ro + rd * t;
    float d = mapScene(p);
    if (d < 0.001) { hit = true; break; }
    t += d * 0.8;
    if (t > 20.0) break;
  }

  vec3 col;
  if (hit) {
    vec3 n = calcNormal(p);
    vec3 lightDir = normalize(vec3(0.5, 0.8, 0.6));
    float diff = clamp(dot(n, lightDir), 0.0, 1.0);
    float fresnel = pow(1.0 - clamp(dot(n, -rd), 0.0, 1.0), 2.5);
    vec3 blobCol = blendColor(p);
    vec3 base = blobCol * (0.35 + 0.65 * diff);
    vec3 glow = blobCol * fresnel * 1.4;
    col = (base + glow) * uGlobalIntensity;

    vec3 lp = localBlobCoord(p);
    vec3 photoSample = triplanarSample(lp, n, 0.32);
    float revealNoise = vnoise(p * 0.85 + uTime * 0.04);
    float reveal = uPhotoReveal * smoothstep(0.05, 0.55, revealNoise) * (0.65 + 0.35 * fresnel);
    col = mix(col, col * 0.18 + photoSample * 1.05, reveal);
  } else {
    col = mix(vec3(0.02,0.015,0.03), vec3(0.05,0.03,0.06), uv.y * 0.5 + 0.5);
  }

  fragColor = vec4(col, 1.0);
}`;

// ═══════════════════════════════════════════════════════════════
// Colores por entidad (índice fijo en el arreglo de 5 blobs)
// 0: generación experimentada · 1: generación joven
// 2: academia · 3: industria · 4: ciudad
// ═══════════════════════════════════════════════════════════════
const COLORS = [
  [0.851, 0.545, 0.251], // ámbar — experiencia
  [0.851, 0.247, 0.749], // magenta — juventud
  [0.247, 0.549, 0.549], // teal — academia
  [0.349, 0.400, 0.533], // slate — industria
  [0.451, 0.502, 0.251], // sage — ciudad
];

function blob(pos, r, active) { return { pos, r, active }; }

// cada momento define dónde está cada blob, qué tan grande, qué tan
// activo, y el K global (facilidad de fusión). El "porqué" de cada
// decisión queda en el comentario, no solo en el número.
const MOMENTS = [
  {
    kicker: "Future Leaders Forum · Fórum UPB",

const canvas = document.getElementById('glcanvas');
const gl = canvas.getContext('webgl2');
if (!gl) {
  document.body.innerHTML = '<div style="color:#fff;padding:40px;font-family:sans-serif;">Este navegador no soporta WebGL2.</div>';
  throw new Error('WebGL2 no disponible');
}

function compileShader(src, type) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
    console.error(gl.getShaderInfoLog(s));
    throw new Error('Error compilando shader');
  }
  return s;
}

const vs = compileShader(VERT_SRC, gl.VERTEX_SHADER);
const fs = compileShader(FRAG_SRC, gl.FRAGMENT_SHADER);
const program = gl.createProgram();
gl.attachShader(program, vs);
gl.attachShader(program, fs);
gl.linkProgram(program);
if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
  console.error(gl.getProgramInfoLog(program));
  throw new Error('Error enlazando programa');
}
gl.useProgram(program);

const quad = new Float32Array([-1,-1, 1,-1, -1,1, 1,1]);
const vbo = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
gl.bufferData(gl.ARRAY_BUFFER, quad, gl.STATIC_DRAW);
const aPosition = gl.getAttribLocation(program, 'aPosition');
gl.enableVertexAttribArray(aPosition);
gl.vertexAttribPointer(aPosition, 2, gl.FLOAT, false, 0, 0);

const uniforms = {
  resolution: gl.getUniformLocation(program, 'uResolution'),
  time: gl.getUniformLocation(program, 'uTime'),
  blobPos: gl.getUniformLocation(program, 'uBlobPos'),
  blobRadius: gl.getUniformLocation(program, 'uBlobRadius'),
  blobColor: gl.getUniformLocation(program, 'uBlobColor'),
  blobActive: gl.getUniformLocation(program, 'uBlobActive'),
  k: gl.getUniformLocation(program, 'uK'),
  noiseAmp: gl.getUniformLocation(program, 'uNoiseAmp'),
  intensity: gl.getUniformLocation(program, 'uGlobalIntensity'),
  photoTex: gl.getUniformLocation(program, 'uPhotoTex'),
  photoReveal: gl.getUniformLocation(program, 'uPhotoReveal'),
};

function loadTexture(gl, dataUrl) {
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 1, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, new Uint8Array([20,18,24,255]));
  const img = new Image();
  img.onload = () => {
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, img);
    gl.generateMipmap(gl.TEXTURE_2D);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.REPEAT);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.REPEAT);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  };
  img.src = dataUrl;
  return tex;
}

const PHOTO_TEXTURES = {
  lounge: loadTexture(gl, 'data:image/jpeg;base64,' + PHOTO_LOUNGE_B64),
  auditorio: loadTexture(gl, 'data:image/jpeg;base64,' + PHOTO_AUDITORIO_B64),
  panel: loadTexture(gl, 'data:image/jpeg;base64,' + PHOTO_PANEL_B64),
  mesaRedonda: loadTexture(gl, 'data:image/jpeg;base64,' + PHOTO_MESAREDONDA_B64),
  campus: loadTexture(gl, 'data:image/jpeg;base64,' + PHOTO_CAMPUS_B64),
  cierre: loadTexture(gl, 'data:image/jpeg;base64,' + PHOTO_CIERRE_B64)
};
let activeTexture = PHOTO_TEXTURES.lounge;

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.floor(window.innerWidth * dpr);
  canvas.height = Math.floor(window.innerHeight * dpr);
  canvas.style.width = window.innerWidth + 'px';
  canvas.style.height = window.innerHeight + 'px';
  gl.viewport(0, 0, canvas.width, canvas.height);
}
window.addEventListener('resize', resize);
resize();

// ═══════════════════════════════════════════════════════════════
// Interpolación entre momentos
// ═══════════════════════════════════════════════════════════════
function lerp(a, b, t) { return a + (b - a) * t; }
function easeInOutCubic(t) { return t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2,3)/2; }

function snapshotFrom(moment) {
  return {
    blobs: moment.blobs.map(b => ({ pos: b.pos.slice(), r: b.r, active: b.active })),
    k: moment.k, noiseAmp: moment.noiseAmp, intensity: moment.intensity, photoReveal: moment.photoReveal,
  };
}

let currentIndex = 0;
let fromState = snapshotFrom(MOMENTS[0]);
let toState = snapshotFrom(MOMENTS[0]);
let transStart = 0;
const TRANS_MS = 2200;

function goTo(index) {
  index = Math.max(0, Math.min(MOMENTS.length - 1, index));
  if (index === currentIndex && performance.now() - transStart < TRANS_MS) return;
  fromState = currentState();
  toState = snapshotFrom(MOMENTS[index]);
  currentIndex = index;
  transStart = performance.now();
  if (MOMENTS[index].photo) activeTexture = PHOTO_TEXTURES[MOMENTS[index].photo];
  updateText();
}

function currentState() {
  const t = Math.min(1, (performance.now() - transStart) / TRANS_MS);
  const e = easeInOutCubic(t);
  return {
    blobs: fromState.blobs.map((b, i) => ({
      pos: b.pos.map((v, k) => lerp(v, toState.blobs[i].pos[k], e)),
      r: lerp(b.r, toState.blobs[i].r, e),
      active: lerp(b.active, toState.blobs[i].active, e),
    })),
    k: lerp(fromState.k, toState.k, e),
    noiseAmp: lerp(fromState.noiseAmp, toState.noiseAmp, e),
    intensity: lerp(fromState.intensity, toState.intensity, e),
    photoReveal: lerp(fromState.photoReveal, toState.photoReveal, e),
  };
}

function updateText() {
  const m = MOMENTS[currentIndex];
  const kickerEl = document.getElementById('kicker');
  const titleEl = document.getElementById('title');
  kickerEl.classList.add('hidden');
  titleEl.classList.add('hidden');
  setTimeout(() => {
    kickerEl.textContent = m.kicker;
    titleEl.textContent = m.title;
    kickerEl.classList.remove('hidden');
    titleEl.classList.remove('hidden');
  }, 280);
  document.getElementById('progress').textContent =
    (currentIndex + 1).toString().padStart(2, '0') + ' / ' + MOMENTS.length.toString().padStart(2, '0');
  document.getElementById('qrPanel').classList.toggle('show', currentIndex === MOMENTS.length - 1);
}
updateText();

// ═══════════════════════════════════════════════════════════════
// Render loop
// ═══════════════════════════════════════════════════════════════
const startTime = performance.now();

function render() {
  const state = currentState();

  const flatPos = new Float32Array(15);
  const flatR = new Float32Array(5);
  const flatCol = new Float32Array(15);
  const flatActive = new Float32Array(5);
  for (let i = 0; i < 5; i++) {
    flatPos[i*3+0] = state.blobs[i].pos[0];
    flatPos[i*3+1] = state.blobs[i].pos[1];
    flatPos[i*3+2] = state.blobs[i].pos[2];
    flatR[i] = state.blobs[i].r;
    flatCol[i*3+0] = COLORS[i][0];
    flatCol[i*3+1] = COLORS[i][1];
    flatCol[i*3+2] = COLORS[i][2];
    flatActive[i] = state.blobs[i].active;
  }

  gl.uniform2f(uniforms.resolution, canvas.width, canvas.height);
  gl.uniform1f(uniforms.time, (performance.now() - startTime) / 1000);
  gl.uniform3fv(uniforms.blobPos, flatPos);
  gl.uniform1fv(uniforms.blobRadius, flatR);
  gl.uniform3fv(uniforms.blobColor, flatCol);
  gl.uniform1fv(uniforms.blobActive, flatActive);
  gl.uniform1f(uniforms.k, state.k);
  gl.uniform1f(uniforms.noiseAmp, state.noiseAmp);
  gl.uniform1f(uniforms.intensity, state.intensity);

  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, activeTexture);
  gl.uniform1i(uniforms.photoTex, 0);
  gl.uniform1f(uniforms.photoReveal, state.photoReveal);

  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  requestAnimationFrame(render);
}
requestAnimationFrame(render);

// ═══════════════════════════════════════════════════════════════
// Controles de teclado
// ═══════════════════════════════════════════════════════════════
window.addEventListener('keydown', (e) => {
  if (e.code === 'Space' || e.code === 'ArrowRight') { e.preventDefault(); goTo(currentIndex + 1); }
  else if (e.code === 'ArrowLeft') { e.preventDefault(); goTo(currentIndex - 1); }
  else if (e.key === 'f' || e.key === 'F') {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen();
    else document.exitFullscreen();
  } else if (e.key === 'r' || e.key === 'R') {
    goTo(0);
  } else if (e.key === 'h' || e.key === 'H') {
    document.getElementById('help').classList.toggle('hidden');
    document.getElementById('progress').classList.toggle('hidden');
  }
});

// controles táctiles: sin esto, en un celular no hay forma de avanzar.
// tocar la mitad derecha de la pantalla avanza, la izquierda retrocede.
window.addEventListener('touchend', (e) => {
  if (e.changedTouches.length === 0) return;
  const x = e.changedTouches[0].clientX;
  if (x > window.innerWidth / 2) goTo(currentIndex + 1);
  else goTo(currentIndex - 1);
}, { passive: true });
</script>
